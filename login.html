<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — TeacherPal</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono&family=Nunito:wght@400;600;700&family=Orbitron:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('teacherpal.theme')||'jarvis';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','jarvis');}})();</script>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-page {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: var(--space-5);
    }
    .login-box {
      position: relative;
      width: min(28rem, 100%);
      background: var(--card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: var(--space-6) var(--space-6) var(--space-5);
      box-shadow: var(--shadow-card);
    }
    .login-box::before {
      content: "";
      position: absolute; inset: 0 var(--space-5) auto;
      height: 1px;
      background: var(--gradient-glow-top);
    }
    .login-brand {
      display: flex; align-items: center; gap: var(--space-3);
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.82rem;
      color: var(--text);
      margin-bottom: var(--space-5);
    }
    .login-brand-mark {
      width: 0.9rem; height: 0.9rem;
      background: var(--accent);
      transform: rotate(45deg);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .login-title {
      font-family: var(--font-display);
      font-weight: var(--fw-medium);
      text-transform: uppercase;
      letter-spacing: var(--track-display);
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0 0 var(--space-2);
    }
    .login-hero {
      font-family: var(--font-body);
      font-weight: var(--fw-bold);
      font-size: var(--fs-xl);
      line-height: 1.15;
      margin: 0 0 var(--space-5);
    }
    .login-form { display: grid; gap: var(--space-4); }
    .login-field { display: grid; gap: var(--space-2); }
    .login-field label {
      font-family: var(--font-body);
      font-weight: var(--fw-semibold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: var(--fs-xs);
      color: var(--text-muted);
    }
    .login-field input {
      width: 100%;
      min-height: 2.6rem;
      padding: 0.55rem 0.85rem;
      font-size: var(--fs-md);
    }
    .login-submit { min-height: 2.8rem; font-size: var(--fs-md); margin-top: var(--space-2); }
    .login-msg {
      min-height: 1.4rem;
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--danger);
    }
    .login-msg.ok { color: var(--ok); }
    .login-foot {
      margin-top: var(--space-5);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    /* Keep the floating full-screen widget out of the login flow. */
    body.no-auth .fs-float { display: none; }
  </style>
</head>
<body class="hub no-auth">
  <main class="page login-page">
    <div id="status" class="status" hidden></div>
    <form class="login-box" id="login-form" novalidate>
      <div class="login-brand"><span class="login-brand-mark" aria-hidden="true"></span>TeacherPal</div>
      <p class="login-title">Sign in</p>
      <h1 class="login-hero">Welcome back.</h1>

      <div class="login-form">
        <div class="login-field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" autocomplete="username" spellcheck="false" autocapitalize="off" required autofocus>
        </div>
        <div class="login-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <div class="login-msg" id="login-msg" role="status" aria-live="polite"></div>
        <button type="submit" class="primary login-submit" id="login-submit">Sign in</button>
      </div>

      <p class="login-foot">Accounts are created in the Supabase dashboard. If you don't have one, ask Khalid.</p>
    </form>

    <!-- Shown when a password-recovery link brings the user here. Hidden by default. -->
    <form class="login-box" id="recovery-form" novalidate hidden>
      <div class="login-brand"><span class="login-brand-mark" aria-hidden="true"></span>TeacherPal</div>
      <p class="login-title">Set a new password</p>
      <h1 class="login-hero">Almost there.</h1>

      <div class="login-form">
        <div class="login-field">
          <label for="rec-pw">New password</label>
          <input type="password" id="rec-pw" minlength="6" autocomplete="new-password" required autofocus>
        </div>
        <div class="login-field">
          <label for="rec-pw2">Confirm password</label>
          <input type="password" id="rec-pw2" minlength="6" autocomplete="new-password" required>
        </div>
        <div class="login-msg" id="rec-msg" role="status" aria-live="polite"></div>
        <button type="submit" class="primary login-submit" id="rec-submit">Save password</button>
      </div>
      <p class="login-foot">Link expired? <a href="login.html">Back to sign in</a></p>
    </form>

    <!-- Shown when the recovery link is malformed or expired. -->
    <div class="login-box" id="recovery-error" hidden style="text-align:center">
      <div class="login-brand" style="justify-content:center"><span class="login-brand-mark" aria-hidden="true"></span>TeacherPal</div>
      <p class="login-title">Reset link problem</p>
      <p class="login-msg" id="rec-err-msg" style="min-height:auto;margin:0 0 var(--space-4)"></p>
      <p class="login-foot"><a href="login.html">Back to sign in</a></p>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    (function () {
      // --- Recovery detection ------------------------------------------
      // Supabase can hand us three shapes depending on the project's auth
      // flow. We handle all three so the same page works regardless.
      const recovery = parseRecoveryFromUrl();
      if (recovery) {
        // Strip sensitive tokens from the URL bar immediately; we hold them
        // in memory for this session.
        history.replaceState(null, '', location.pathname);
        if (recovery.error) return showRecoveryError(recovery.error);
        return showRecoveryForm(recovery);
      }

      // --- Normal sign-in ----------------------------------------------
      const form = document.getElementById('login-form');
      const userEl = document.getElementById('login-username');
      const pwEl = document.getElementById('login-password');
      const msgEl = document.getElementById('login-msg');
      const submitBtn = document.getElementById('login-submit');

      // If already signed in, jump straight to wherever they were headed.
      if (hasSession()) redirectAfterLogin();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = userEl.value.trim();
        const password = pwEl.value;
        if (!username || !password) { setMsg(msgEl, 'Enter your username and password.'); return; }
        setMsg(msgEl, '');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';
        try {
          await signIn(username, password);
          setMsg(msgEl, 'Signed in.', 'ok');
          redirectAfterLogin();
        } catch (err) {
          setMsg(msgEl, err.message || 'Sign-in failed.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        }
      });

      // --- Helpers -----------------------------------------------------
      function setMsg(el, text, kind) {
        el.textContent = text || '';
        el.classList.toggle('ok', kind === 'ok');
      }
      function redirectAfterLogin() {
        const params = new URLSearchParams(location.search);
        const from = params.get('from');
        const safe = from && !/^(?:[a-z]+:|\/\/)/i.test(from) ? from : 'index.html';
        location.replace(safe);
      }

      function parseRecoveryFromUrl() {
        if (location.hash && location.hash.length > 1) {
          const h = new URLSearchParams(location.hash.slice(1));
          if (h.get('type') === 'recovery' && h.get('access_token')) {
            return {
              kind: 'implicit',
              access_token: h.get('access_token'),
              refresh_token: h.get('refresh_token') || null,
              expires_in: Number(h.get('expires_in') || 3600),
            };
          }
          if (h.get('error')) {
            return { error: humanErr(h.get('error_description') || h.get('error')) };
          }
        }
        const q = new URLSearchParams(location.search);
        if (q.get('code')) return { kind: 'code', code: q.get('code') };
        if (q.get('type') === 'recovery' && q.get('token_hash')) {
          return { kind: 'verify', token_hash: q.get('token_hash') };
        }
        if (q.get('error')) {
          return { error: humanErr(q.get('error_description') || q.get('error')) };
        }
        return null;
      }

      function humanErr(msg) {
        if (!msg) return 'The reset link is invalid.';
        const s = String(msg).replace(/\+/g, ' ');
        if (/expired/i.test(s)) return 'This reset link has expired. Request a new one.';
        if (/invalid/i.test(s)) return 'This reset link is invalid. Request a new one.';
        return s;
      }

      function showRecoveryError(text) {
        document.getElementById('login-form').hidden = true;
        document.getElementById('rec-err-msg').textContent = text;
        document.getElementById('recovery-error').hidden = false;
      }

      function showRecoveryForm(recovery) {
        document.getElementById('login-form').hidden = true;
        const form = document.getElementById('recovery-form');
        form.hidden = false;
        const pw = document.getElementById('rec-pw');
        const pw2 = document.getElementById('rec-pw2');
        const msg = document.getElementById('rec-msg');
        const btn = document.getElementById('rec-submit');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (pw.value.length < 6) { setMsg(msg, 'Password must be at least 6 characters.'); return; }
          if (pw.value !== pw2.value) { setMsg(msg, "Passwords don't match."); return; }
          setMsg(msg, '');
          btn.disabled = true;
          btn.textContent = 'Saving…';
          try {
            const tokens = await tokensFromRecovery(recovery);
            const user   = await updatePasswordWithToken(tokens.access_token, pw.value);
            const profile = await resolveEmailToProfile(user.email);
            if (!profile) throw new Error("Password saved, but there is no profile for this account. Ask Khalid to add one.");
            // Sign in fresh with the new password so the session is clean.
            await signIn(profile.username, pw.value);
            setMsg(msg, 'Signed in.', 'ok');
            location.replace('index.html');
          } catch (err) {
            setMsg(msg, err.message || 'Could not save the new password.');
            btn.disabled = false;
            btn.textContent = 'Save password';
          }
        });
      }

      // Turn any of the three recovery-URL shapes into {access_token, …}.
      async function tokensFromRecovery(rec) {
        if (rec.kind === 'implicit') return rec;
        if (rec.kind === 'code') {
          const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=pkce`, {
            method: 'POST',
            headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ auth_code: rec.code }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error_description || data.msg || 'Recovery link exchange failed.');
          return data;
        }
        if (rec.kind === 'verify') {
          const res = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
            method: 'POST',
            headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'recovery', token_hash: rec.token_hash }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error_description || data.msg || 'Recovery verify failed.');
          return data;
        }
        throw new Error('Unknown recovery link.');
      }

      async function updatePasswordWithToken(accessToken, password) {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.msg || data.error_description || 'Password update failed.');
        return data;
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — TeacherPal</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .login-page {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: var(--space-5);
    }
    .login-box {
      position: relative;
      width: min(28rem, 100%);
      background: var(--card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: var(--space-6) var(--space-6) var(--space-5);
      box-shadow: var(--shadow-card);
    }
    .login-box::before {
      content: "";
      position: absolute; inset: 0 var(--space-5) auto;
      height: 1px;
      background: var(--gradient-glow-top);
    }
    .login-brand {
      display: flex; align-items: center; gap: var(--space-3);
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.82rem;
      color: var(--text);
      margin-bottom: var(--space-5);
    }
    .login-brand-mark {
      width: 0.9rem; height: 0.9rem;
      background: var(--accent);
      transform: rotate(45deg);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .login-title {
      font-family: var(--font-display);
      font-weight: var(--fw-medium);
      text-transform: uppercase;
      letter-spacing: var(--track-display);
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0 0 var(--space-2);
    }
    .login-hero {
      font-family: var(--font-body);
      font-weight: var(--fw-bold);
      font-size: var(--fs-xl);
      line-height: 1.15;
      margin: 0 0 var(--space-5);
    }
    .login-form { display: grid; gap: var(--space-4); }
    .login-field { display: grid; gap: var(--space-2); }
    .login-field label {
      font-family: var(--font-body);
      font-weight: var(--fw-semibold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: var(--fs-xs);
      color: var(--text-muted);
    }
    .login-field input {
      width: 100%;
      min-height: 2.6rem;
      padding: 0.55rem 0.85rem;
      font-size: var(--fs-md);
    }
    .login-submit { min-height: 2.8rem; font-size: var(--fs-md); margin-top: var(--space-2); }
    .login-msg {
      min-height: 1.4rem;
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--danger);
    }
    .login-msg.ok { color: var(--ok); }
    .login-foot {
      margin-top: var(--space-5);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    /* Keep the floating full-screen widget out of the login flow. */
    body.no-auth .fs-float { display: none; }
  </style>
</head>
<body class="hub no-auth">
  <main class="page login-page">
    <div id="status" class="status" hidden></div>
    <form class="login-box" id="login-form" novalidate>
      <div class="login-brand"><span class="login-brand-mark" aria-hidden="true"></span>TeacherPal</div>
      <p class="login-title">Sign in</p>
      <h1 class="login-hero">Welcome back.</h1>

      <div class="login-form">
        <div class="login-field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" autocomplete="username" spellcheck="false" autocapitalize="off" required autofocus>
        </div>
        <div class="login-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <div class="login-msg" id="login-msg" role="status" aria-live="polite"></div>
        <button type="submit" class="primary login-submit" id="login-submit">Sign in</button>
      </div>

      <p class="login-foot">Accounts are created in the Supabase dashboard. If you don't have one, ask Khalid.</p>
    </form>
  </main>

  <script src="shared.js"></script>
  <script>
    (function () {
      const form = document.getElementById('login-form');
      const userEl = document.getElementById('login-username');
      const pwEl = document.getElementById('login-password');
      const msgEl = document.getElementById('login-msg');
      const submitBtn = document.getElementById('login-submit');

      // If already signed in, jump straight to wherever they were headed.
      if (hasSession()) redirectAfterLogin();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = userEl.value.trim();
        const password = pwEl.value;
        if (!username || !password) { setMsg('Enter your username and password.'); return; }
        setMsg('');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';
        try {
          await signIn(username, password);
          setMsg('Signed in.', 'ok');
          redirectAfterLogin();
        } catch (err) {
          setMsg(err.message || 'Sign-in failed.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        }
      });

      function setMsg(text, kind) {
        msgEl.textContent = text || '';
        msgEl.classList.toggle('ok', kind === 'ok');
      }
      function redirectAfterLogin() {
        const params = new URLSearchParams(location.search);
        const from = params.get('from');
        // Only allow same-origin relative paths.
        const safe = from && !/^(?:[a-z]+:|\/\/)/i.test(from) ? from : 'index.html';
        location.replace(safe);
      }
    })();
  </script>
</body>
</html>

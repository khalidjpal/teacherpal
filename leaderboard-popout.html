<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — projector</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="lb-popout no-auth">
  <main class="leaderboard-page" data-view="show">
    <section class="lb-show" id="lb-show" aria-label="Standings">
      <h1 class="lb-show-title" id="lb-show-title"></h1>
      <ol class="lb-stand" id="lb-show-list"></ol>
      <p class="lb-show-empty" id="lb-show-empty">Connecting to the Leaderboard tab…</p>
    </section>
  </main>
  <script src="leaderboard.js"></script>
</body>
</html>

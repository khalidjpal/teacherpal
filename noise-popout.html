<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noise Meter</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('teacherpal.theme')||'jarvis';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','jarvis');}})();</script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="noise-popout">
  <!-- Read-only projector view. No mic here: the main window owns it and
       sends readings over BroadcastChannel('teacherpal-noise'). -->
  <div class="noise-popout-inner">
    <div class="noise-meter" id="noise-meter" data-zone="off" data-alert="0" data-running="0">
      <div class="noise-read">
        <span class="noise-db" id="noise-db">—</span>
        <span class="noise-unit">dB<span class="approx">≈</span></span>
      </div>
      <div class="noise-bar" id="noise-bar" role="meter" aria-label="Room volume" aria-valuemin="35" aria-valuemax="95" aria-valuenow="35">
        <div class="noise-fill" id="noise-fill"></div>
        <span class="noise-mark" id="mark-quiet" aria-hidden="true"></span>
        <span class="noise-mark" id="mark-loud" aria-hidden="true"></span>
      </div>
      <div class="noise-zone" id="noise-zone">Mic off</div>
    </div>
    <p class="noise-link" id="noise-link">Press Start on the Noise Meter tab to begin.</p>
  </div>
  <script src="noise.js"></script>
</body>
</html>

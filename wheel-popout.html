<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Wheel</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Orbitron:wght@500;600;700&family=Pirata+One&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('teacherpal.theme')||'jarvis';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','jarvis');}})();</script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="wheel-popout">
  <!-- Read-only projector view. The main window owns the roster and the spin
       and sends { list, rotation, spin, winnerId } over
       BroadcastChannel('teacherpal-wheel'); this window just draws it. -->
  <div class="wheel-stage" id="wheel-stage" data-state="">
    <span class="wheel-period" id="wheel-period" hidden></span>
    <div class="wheel-wrap">
      <svg class="wheel-svg" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="wheel-face-grad" cx="36%" cy="30%" r="78%">
                <stop class="face-hi" offset="0%"/>
                <stop class="face-lo" offset="100%"/>
              </radialGradient>
              <linearGradient id="wheel-housing-grad" x1="0" y1="0" x2="0" y2="1">
                <stop class="hg-top" offset="0%"/>
                <stop class="hg-bot" offset="100%"/>
              </linearGradient>
              <radialGradient id="wheel-ish" cx="50%" cy="50%" r="50%">
                <stop class="ish-clear" offset="74%"/>
                <stop class="ish-mid" offset="93%"/>
                <stop class="ish-edge" offset="100%"/>
              </radialGradient>
            </defs>

            <circle class="housing" cx="50" cy="50" r="48.6"/>
            <path class="housing-foot" d="M9.9 77 A48.6 48.6 0 0 0 90.1 77"/>
            <circle class="housing-hi" cx="50" cy="50" r="50"/>

            <g id="wheel-rotor"></g>
            <circle class="face-sheen" cx="50" cy="50" r="46"/>
            <circle class="face-ish" cx="50" cy="50" r="46"/>
            <circle class="wheel-rim" cx="50" cy="50" r="46"/>
            <g class="wheel-dial" id="wheel-dial"></g>

            <circle class="wheel-hub" cx="50" cy="50" r="20"/>
            <circle class="wheel-hub-ring" cx="50" cy="50" r="22.3"/>
            <g class="wheel-axle">
              <circle class="bolt" cx="61" cy="39" r="1.15"/>
              <circle class="bolt" cx="61" cy="61" r="1.15"/>
              <circle class="bolt" cx="39" cy="61" r="1.15"/>
              <circle class="bolt" cx="39" cy="39" r="1.15"/>
            </g>

            <g class="pointer-mount">
              <rect class="bracket" x="46" y="-0.2" width="8" height="3.6" rx="1.2"/>
              <rect class="bracket-hi" x="46" y="-0.2" width="8" height="0.9" rx="0.45"/>
              <g class="pointer-arm" id="wheel-pointer">
                <path class="pointer-hud" d="M47.3 1.4 L50 6.2 L52.7 1.4"/>
                <path class="pointer-soft" d="M50 6.6 C48.2 4.6 47.3 3.7 47.3 2.7 A2.7 2.7 0 0 1 52.7 2.7 C52.7 3.7 51.8 4.6 50 6.6 Z"/>
                <path class="pointer-heart" d="M50 7.6 C48 6.1 44.9 4 44.9 1.2 A2.55 2.55 0 0 1 50 1.2 A2.55 2.55 0 0 1 55.1 1.2 C55.1 4 52 6.1 50 7.6 Z"/>
                <ellipse class="pointer-heart-hi" cx="47.1" cy="0.6" rx="1" ry="0.65" transform="rotate(-30 47.1 0.6)"/>
              </g>
            </g>
          </svg>
      <div class="wheel-hub-text">
        <span class="wheel-hub-name" id="wheel-hub-name"></span>
      </div>
      <div class="wheel-mascot" id="wheel-mascot" data-mood="idle" aria-hidden="true"></div>
      <p class="wheel-empty" id="wheel-empty" hidden>Waiting for the Name Wheel tab…</p>
    </div>
  </div>
  <script src="cauldron.js"></script>
  <script src="boba.js"></script>
  <script src="wheel.js"></script>
</body>
</html>

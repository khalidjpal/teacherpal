<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — TeacherPal</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono&family=Nunito:wght@400;600;700&family=Orbitron:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('teacherpal.theme')||'jarvis';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','jarvis');}})();</script>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-page {
      padding: var(--space-5) var(--page-pad);
      display: grid;
      grid-template-columns: minmax(0, 28rem) minmax(0, 1fr);
      gap: var(--space-5);
      align-items: start;
    }
    @media (max-width: 900px) { .admin-page { grid-template-columns: 1fr; } }

    .admin-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-card);
    }
    .admin-card::before {
      content: "";
      position: absolute; inset: 0 var(--space-5) auto;
      height: 1px;
      background: var(--gradient-glow-top);
    }
    .admin-card h2 {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: var(--fw-medium);
      text-transform: uppercase;
      letter-spacing: var(--track-display);
      color: var(--text-muted);
      margin: 0 0 var(--space-4);
    }

    .admin-form { display: grid; gap: var(--space-4); }
    .admin-field { display: grid; gap: var(--space-2); }
    .admin-field label {
      font-family: var(--font-body);
      font-weight: var(--fw-semibold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: var(--fs-xs);
      color: var(--text-muted);
    }
    .admin-field input {
      width: 100%;
      min-height: 2.4rem;
      padding: 0.4rem 0.75rem;
      font-size: var(--fs-md);
    }
    .admin-msg {
      min-height: 1.4rem;
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--danger);
    }
    .admin-msg.ok { color: var(--ok); }

    .user-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
    .user-table th {
      font-family: var(--font-display);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: var(--track-label);
      color: var(--text-muted);
      text-align: left;
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--border-strong);
      font-weight: var(--fw-medium);
    }
    .user-table td {
      padding: 0.55rem 0.6rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .user-table tr:last-child td { border-bottom: 0; }
    .user-table .u-name { font-weight: var(--fw-semibold); }
    .user-table .u-email { color: var(--text-muted); font-family: var(--font-mono); font-size: var(--fs-xs); }
    .user-table .u-when  { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); white-space: nowrap; }
    .user-table .badge-admin {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
    }
    .user-table td.actions { text-align: right; white-space: nowrap; }
    .user-table td.actions button { min-height: 2rem; font-size: var(--fs-xs); padding: 0.3rem 0.7rem; }

    .list-empty { color: var(--text-muted); font-style: italic; padding: var(--space-4) 0; }
    .list-note  { color: var(--text-muted); font-family: var(--font-mono); font-size: 0.78rem; margin: 0 0 var(--space-4); }
  </style>
</head>
<body class="hub">
  <div class="app">
    <header class="topbar"></header>

    <main class="page admin-page" hidden id="admin-main">
      <section class="admin-card" style="grid-column: 1 / -1">
        <h2>Users</h2>
        <p class="list-note">Users are created and their passwords set in the Supabase dashboard (Authentication → Users). This page is read-only.</p>
        <div id="user-list"><p class="list-empty">Loading…</p></div>
      </section>

      <div id="status" class="status" hidden></div>
    </main>
  </div>

  <script src="shared.js"></script>
  <script src="schedule.js"></script>
  <script src="nav.js"></script>
  <script>
    (function () {
      if (!hasSession()) return;   // shared.js already handled the redirect
      if (!isAdmin()) { location.replace('index.html'); return; }
      document.getElementById('admin-main').hidden = false;

      const list = document.getElementById('user-list');
      const me = currentUser();

      loadUsers();

      async function loadUsers() {
        try {
          const users = await adminListUsers();
          renderUsers(users || []);
        } catch (err) {
          list.innerHTML = `<p class="list-empty">Couldn't load users: ${escapeHtml(humanErr(err))}</p>`;
        }
      }

      function renderUsers(users) {
        if (!users.length) { list.innerHTML = '<p class="list-empty">No users yet.</p>'; return; }
        const rows = users.map((u) => {
          const isMe = me && u.user_id === me.id;
          const admin = u.is_admin ? ' <span class="badge-admin">ADMIN</span>' : '';
          const display = u.username || u.email.split('@')[0];
          const last = u.last_sign_in_at
            ? new Date(u.last_sign_in_at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            : '—';
          return `
            <tr>
              <td>
                <div class="u-name">${escapeHtml(display)}${admin}${isMe ? ' <span class="u-email">(you)</span>' : ''}</div>
                <div class="u-email">${escapeHtml(u.email)}</div>
              </td>
              <td class="u-when">${escapeHtml(last)}</td>
            </tr>`;
        }).join('');
        list.innerHTML = `
          <table class="user-table">
            <thead><tr><th>User</th><th>Last sign-in</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      }

      function humanErr(err) {
        const m = (err && err.message) || String(err);
        const match = m.match(/\{[^{}]*"message"\s*:\s*"([^"]+)"/);
        return match ? match[1] : m;
      }
    })();
  </script>
</body>
</html>
